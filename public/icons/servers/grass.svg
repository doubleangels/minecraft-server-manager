<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Top Grass Canopy Gradient -->
    <linearGradient id="g-top" x1="4" y1="3" x2="20" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Left Soil Shading -->
    <linearGradient id="g-dirt-l" x1="3.5" y1="7.5" x2="12" y2="21.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B3410"/>
      <stop offset="100%" stop-color="#3D1A04"/>
    </linearGradient>
    <!-- Right Soil Shading (Lit Side) -->
    <linearGradient id="g-dirt-r" x1="12" y1="7.5" x2="20.5" y2="21.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A4513"/>
      <stop offset="100%" stop-color="#4E2308"/>
    </linearGradient>
    <!-- Organic Grass Overhang -->
    <linearGradient id="g-hang-l" x1="3.5" y1="7.5" x2="12" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="g-hang-r" x1="12" y1="7.5" x2="20.5" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Left Dirt Face -->
  <path d="M3.5 7.5L12 12.2V21.2L3.5 16.5V7.5Z" fill="url(#g-dirt-l)"/>

  <!-- Right Dirt Face -->
  <path d="M12 12.2L20.5 7.5V16.5L12 21.2V12.2Z" fill="url(#g-dirt-r)"/>

  <!-- Soil Stratigraphy & Subsurface Stones -->
  <path d="M5.5 14.5L7 13.8L7.8 14.6L6.3 15.3Z" fill="#A16207" opacity="0.7"/>
  <path d="M8 17.5L9.5 16.8L10.2 17.6L8.7 18.3Z" fill="#2E1202" opacity="0.8"/>
  <path d="M15 15.5L16.5 14.8L17.2 15.6L15.7 16.3Z" fill="#A16207" opacity="0.65"/>
  <path d="M17 18L18.2 17.4L18.8 18.1L17.6 18.7Z" fill="#D97706" opacity="0.6"/>

  <!-- Ambient Shadow cast by Grass Overhang -->
  <path d="M3.5 8L12 12.6V15.5C10.8 15.5 10 14.2 9 15C8 15.8 7.2 14.5 6 15.5C4.8 16 4.2 14.2 3.5 13.5V8Z" fill="#1C0A00" opacity="0.5"/>
  <path d="M20.5 8L12 12.6V15.5C13.2 15.5 14 14.2 15 15C16 15.8 16.8 14.5 18 15.5C19.2 16 19.8 14.2 20.5 13.5V8Z" fill="#1C0A00" opacity="0.5"/>

  <!-- Left Grass Turf Overhang (Organic Curvature) -->
  <path d="M3.5 7.5L12 12.2V14.8C10.8 14.8 10 13.6 9 14.4C8 15.1 7.2 13.8 6 14.7C4.8 15.3 4.2 13.5 3.5 12.8V7.5Z" fill="url(#g-hang-l)"/>

  <!-- Right Grass Turf Overhang -->
  <path d="M20.5 7.5L12 12.2V14.8C13.2 14.8 14 13.6 15 14.4C16 15.1 16.8 13.8 18 14.7C19.2 15.3 19.8 13.5 20.5 12.8V7.5Z" fill="url(#g-hang-r)"/>

  <!-- Top Grass Surface -->
  <path d="M12 2.5L20.5 7.5L12 12.2L3.5 7.5L12 2.5Z" fill="url(#g-top)"/>

  <!-- Top Lawn Highlights & Bevels -->
  <path d="M3.5 7.5L12 2.5L20.5 7.5" stroke="#6EE7B7" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M12 12.2V21.2" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" opacity="0.25"/>
  <!-- Subtle blade cluster glints -->
  <circle cx="10" cy="6.5" r="0.5" fill="#A7F3D0" opacity="0.8"/>
  <circle cx="14" cy="7.5" r="0.6" fill="#A7F3D0" opacity="0.7"/>
</svg>
