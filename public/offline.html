<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16191c" />
    <title>Offline · Minecraft Server Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="min-h-screen">
    <main class="grid min-h-screen place-items-center p-6">
      <div class="card w-full max-w-sm p-6 text-center">
        <img src="/icons/icon-192.png" alt="" class="mx-auto size-14 rounded-lg" />
        <h1 class="mt-4 text-lg font-semibold">The Panel Can't Be Reached</h1>
        <p class="mt-2 text-sm text-ink-faint">
          This device is offline, or the panel isn't running right now. Your servers keep running either way.
        </p>
        <a class="btn btn-primary mt-5 w-full" href="/">Try Again</a>
      </div>
    </main>
  </body>
</html>
