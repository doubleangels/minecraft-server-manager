<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Volumetric Head Shading -->
    <linearGradient id="cr-head" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Deep Cavity Interior Shadow -->
    <linearGradient id="cr-void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02150E"/>
      <stop offset="100%" stop-color="#05281B"/>
    </linearGradient>
  </defs>

  <!-- Ambient Base Drop Shadow -->
  <rect x="3" y="3.5" width="18" height="18" rx="3" fill="#011810" opacity="0.4"/>

  <!-- Main Sculpted Head Body -->
  <rect x="3" y="3" width="18" height="18" rx="3" fill="url(#cr-head)"/>

  <!-- Subtle Camouflage Blocks (Foliage & Moss Shading) -->
  <rect x="3.5" y="3.5" width="4.5" height="4.5" rx="1" fill="#6EE7B7" opacity="0.35"/>
  <rect x="16" y="3.5" width="4.5" height="4.5" rx="1" fill="#34D399" opacity="0.3"/>
  <rect x="3.5" y="16" width="4.5" height="4.5" rx="1" fill="#065F46" opacity="0.5"/>
  <rect x="16" y="16" width="4.5" height="4.5" rx="1" fill="#047857" opacity="0.5"/>
  <rect x="10" y="3" width="4" height="3" fill="#047857" opacity="0.4"/>

  <!-- Top-Left Volumetric Highlight Rim -->
  <path d="M4.5 3H19.5C20.3 3 21 3.7 21 4.5" stroke="#A7F3D0" stroke-width="0.75" stroke-linecap="round" opacity="0.85"/>
  <path d="M3 4.5V19.5" stroke="#A7F3D0" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom-Right Occlusion Rim -->
  <path d="M4.5 21H19.5C20.3 21 21 20.3 21 19.5V4.5" stroke="#022C22" stroke-width="0.75" stroke-linecap="round" opacity="0.55"/>

  <!-- ================= CARVED EYE CAVITIES ================= -->
  <!-- Left Eye Outer Socket (Cavity Cast Shadow) -->
  <rect x="5.8" y="6.8" width="3.8" height="3.8" rx="0.5" fill="#000000"/>
  <!-- Left Eye Recessed Void -->
  <rect x="6" y="7" width="3.4" height="3.4" rx="0.3" fill="url(#cr-void)"/>
  <!-- Left Eye Lower Ledge Reflection -->
  <line x1="5.8" y1="10.6" x2="9.6" y2="10.6" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>

  <!-- Right Eye Outer Socket (Cavity Cast Shadow) -->
  <rect x="14.4" y="6.8" width="3.8" height="3.8" rx="0.5" fill="#000000"/>
  <!-- Right Eye Recessed Void -->
  <rect x="14.6" y="7" width="3.4" height="3.4" rx="0.3" fill="url(#cr-void)"/>
  <!-- Right Eye Lower Ledge Reflection -->
  <line x1="14.4" y1="10.6" x2="18.2" y2="10.6" stroke="#34D399" stroke-width="0.5" opacity="0.5"/>

  <!-- ================= CARVED NOSE & MOUTH ================= -->
  <!-- Nose Outer Cavity -->
  <rect x="9.8" y="10.4" width="4.4" height="4.2" fill="#000000"/>
  <!-- Mouth Outer Cavity -->
  <path d="M7.8 12.8H16.2V18.2H14.2V14.6H9.8V18.2H7.8V12.8Z" fill="#000000"/>

  <!-- Deep Recessed Void Inner -->
  <rect x="10" y="10.6" width="4" height="3.8" fill="url(#cr-void)"/>
  <path d="M8" y="13H16V18H14.4V14.4H9.6V18H8V13Z" fill="url(#cr-void)"/>

  <!-- Physical Lower Ledge Light Catchers (Volumetric Depth) -->
  <path d="M7.8 18.2H9.8M14.2 18.2H16.2" stroke="#34D399" stroke-width="0.55" opacity="0.5"/>
  <path d="M9.8 14.6H14.2" stroke="#6EE7B7" stroke-width="0.55" opacity="0.6"/>
</svg>
