<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Glowing Ruby Potion Liquid -->
    <linearGradient id="po-liquid" x1="12" y1="11" x2="12" y2="21.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="25%" stop-color="#F43F5E"/>
      <stop offset="65%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <!-- Translucent Glass Flask Volume -->
    <linearGradient id="po-glass" x1="5" y1="8" x2="19" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Natural Wood Cork -->
    <linearGradient id="po-cork" x1="10" y1="1.8" x2="14" y2="4.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Ambient Bottom Shadow -->
  <ellipse cx="12" cy="21.8" rx="6.5" ry="1.2" fill="#4C0519" opacity="0.35"/>

  <!-- Glass Flask Empty Volume (Upper Half) -->
  <path d="M10 8H14L18 15C19.2 17.5 17.5 21 14.5 21.2H9.5C6.5 21 4.8 17.5 6 15L10 8Z" fill="url(#po-glass)"/>

  <!-- Glowing Ruby Elixir Liquid Fill -->
  <path d="M7 13.2C8.5 12.2 11 13.6 13 12.6C14.8 11.6 16 12.8 17 13.2L18 15C19.2 17.5 17.5 21 14.5 21.2H9.5C6.5 21 4.8 17.5 6 15L7 13.2Z" fill="url(#po-liquid)"/>

  <!-- Liquid Surface Wave Meniscus -->
  <path d="M7 13.2C8.5 12.2 11 13.6 13 12.6C14.8 11.6 16 12.8 17 13.2" stroke="#FECDD3" stroke-width="0.85" stroke-linecap="round"/>

  <!-- Rising Effervescent Magic Bubbles -->
  <circle cx="10" cy="18" r="1.1" fill="#FFF1F2" opacity="0.9"/>
  <circle cx="14" cy="16.5" r="0.8" fill="#FFF1F2" opacity="0.85"/>
  <circle cx="11.2" cy="15" r="0.6" fill="#FFF1F2" opacity="0.75"/>
  <circle cx="14.5" cy="19" r="0.5" fill="#FFF1F2" opacity="0.7"/>

  <!-- Glass Outer Body Rim & Bevel -->
  <path d="M10 8H14L18 15C19.2 17.5 17.5 21 14.5 21.2H9.5C6.5 21 4.8 17.5 6 15L10 8Z" stroke="#E2E8F0" stroke-width="0.9" stroke-linejoin="round" opacity="0.85"/>

  <!-- Curved Specular Glass Reflections (Realistic Highlight) -->
  <path d="M7.4 14.8C6.5 16.8 7.4 19.5 9.8 20.2" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
  <path d="M10.8 9.5L12 11.5" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>

  <!-- Glass Neck -->
  <rect x="10.2" y="5" width="3.6" height="3.2" fill="#E2E8F0" opacity="0.4"/>
  <line x1="10.2" y1="5" x2="10.2" y2="8.2" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="13.8" y1="5" x2="13.8" y2="8.2" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- Flared Bottle Lip -->
  <rect x="9" y="4" width="6" height="1.6" rx="0.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
  <line x1="9.5" y1="4.4" x2="14.5" y2="4.4" stroke="#FFFFFF" stroke-width="0.5"/>

  <!-- Natural Turned Wood / Cork Stopper -->
  <path d="M10.2 1.8H13.8L13.4 4H10.6L10.2 1.8Z" fill="url(#po-cork)" stroke="#78350F" stroke-width="0.4"/>
  <ellipse cx="12" cy="1.9" rx="1.8" ry="0.4" fill="#FDE68A" opacity="0.6"/>

  <!-- Twine Tie around Bottle Lip -->
  <line x1="9.5" y1="5.4" x2="14.5" y2="5.4" stroke="#78350F" stroke-width="0.5" stroke-dasharray="1 0.6"/>
</svg>
