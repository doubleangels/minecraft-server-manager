<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Aged Oak Wood Grain Shading -->
    <linearGradient id="c-oak-top" x1="4" y1="3" x2="20" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="c-oak-l" x1="3.5" y1="7.5" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="c-oak-r" x1="12" y1="7.5" x2="20.5" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <!-- Brass Latch Clasp -->
    <linearGradient id="c-brass" x1="10.8" y1="10" x2="13.2" y2="15.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Base Left Face (Aged Oak Body) -->
  <path d="M3.5 10L12 14.2V21L3.5 16.8V10Z" fill="url(#c-oak-l)"/>

  <!-- Base Right Face -->
  <path d="M12 14.2L20.5 10V16.8L12 21V14.2Z" fill="url(#c-oak-r)"/>

  <!-- Wood Plank Horizontal Joinery Seams -->
  <path d="M3.5 13.5L12 17.7M12 17.7L20.5 13.5" stroke="#451A03" stroke-width="0.5" opacity="0.6"/>

  <!-- Forged Iron Corner Brackets (Base) -->
  <path d="M3.5 14.5L5.2 15.3V19.8L3.5 19V14.5Z" fill="#1E293B"/>
  <path d="M20.5 14.5L18.8 15.3V19.8L20.5 19V14.5Z" fill="#0F172A"/>
  <!-- Iron Rivets -->
  <circle cx="4.5" cy="15.8" r="0.4" fill="#94A3B8"/>
  <circle cx="4.5" cy="18.5" r="0.4" fill="#94A3B8"/>
  <circle cx="19.5" cy="15.8" r="0.4" fill="#64748B"/>
  <circle cx="19.5" cy="18.5" r="0.4" fill="#64748B"/>

  <!-- Lid Separation Gap (Deep Shadow on Body) -->
  <path d="M3.5 9.8L12 14.2L20.5 9.8V10.4L12 14.8L3.5 10.4Z" fill="#1C0A00" opacity="0.75"/>

  <!-- Lid Left Face -->
  <path d="M3.5 7.5L12 11.8V13.8L3.5 9.5V7.5Z" fill="#B45309"/>

  <!-- Lid Right Face -->
  <path d="M12 11.8L20.5 7.5V9.5L12 13.8V11.8Z" fill="#D97706"/>

  <!-- Lid Top Face -->
  <path d="M12 3L20.5 7.5L12 11.8L3.5 7.5L12 3Z" fill="url(#c-oak-top)"/>

  <!-- Plank Seams on Lid Top -->
  <path d="M7.5 5L16 9.3" stroke="#92400E" stroke-width="0.45" opacity="0.55"/>

  <!-- Forged Iron Center Reinforcement Strap -->
  <path d="M11.2 3.4L12.8 4.2V11.4L11.2 10.6Z" fill="#1E293B"/>
  <path d="M11.2 10.6L12 11V13.8L11.2 13.4Z" fill="#0F172A"/>
  <path d="M12 11L12.8 10.6V13.4L12 13.8Z" fill="#334155"/>
  <path d="M11.2 13.8L12 14.2V20.8L11.2 20.4Z" fill="#0F172A"/>
  <path d="M12 14.2L12.8 13.8V20.4L12 20.8Z" fill="#1E293B"/>

  <!-- Top Edge Light Catchers -->
  <path d="M3.5 7.5L12 3L20.5 7.5" stroke="#FDE68A" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Solid Brass Lock Clasp (with Cast Shadow & Keyhole) -->
  <!-- Clasp Drop Shadow -->
  <rect x="10.8" y="11" width="2.4" height="4.5" rx="0.5" fill="#1C0A00" opacity="0.5"/>
  <!-- Clasp Body -->
  <rect x="10.8" y="10.5" width="2.4" height="4.2" rx="0.4" fill="url(#c-brass)" stroke="#78350F" stroke-width="0.3"/>
  <!-- Latch Hinge Pin -->
  <line x1="11" y1="11.4" x2="13" y2="11.4" stroke="#FEF08A" stroke-width="0.4"/>
  <!-- Keyhole Notch -->
  <circle cx="12" cy="12.7" r="0.4" fill="#451A03"/>
  <rect x="11.8" y="12.7" width="0.4" height="0.8" fill="#451A03"/>
</svg>
