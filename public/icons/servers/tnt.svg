<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <!-- Red Explosive Shading -->
    <linearGradient id="t-top" x1="3.5" y1="2.8" x2="20.5" y2="12.2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="t-left" x1="3.5" y1="7.5" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="t-right" x1="12" y1="7.5" x2="20.5" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <!-- Label Wrapping Gradient -->
    <linearGradient id="t-label-l" x1="3.5" y1="11" x2="12" y2="15.3" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="t-label-r" x1="12" y1="15.3" x2="20.5" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Left Face Body -->
  <path d="M3.5 7.5L12 12.2V21L3.5 16.5V7.5Z" fill="url(#t-left)"/>

  <!-- Right Face Body -->
  <path d="M12 12.2L20.5 7.5V16.5L12 21V12.2Z" fill="url(#t-right)"/>

  <!-- White Packaging Label Band (Left) -->
  <path d="M3.5 11L12 15.3V18L3.5 13.7V11Z" fill="url(#t-label-l)"/>
  <path d="M3.5 11L12 15.3M3.5 18L12 18" stroke="#64748B" stroke-width="0.3" opacity="0.6"/>

  <!-- White Packaging Label Band (Right) -->
  <path d="M12 15.3L20.5 11V13.7L12 18V15.3Z" fill="url(#t-label-r)"/>
  <path d="M12 15.3L20.5 11M12 18L20.5 13.7" stroke="#94A3B8" stroke-width="0.3" opacity="0.6"/>

  <!-- Stenciled TNT Lettering on Right Face -->
  <!-- 'T' -->
  <path d="M13.2 14.1L14.2 13.6M13.7 13.8V16.3" stroke="#0F172A" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 'N' -->
  <path d="M15.2 13.1V15.6L16.8 14.7V12.3" stroke="#0F172A" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 'T' -->
  <path d="M17.8 11.8L18.8 11.3M18.3 11.5V14" stroke="#0F172A" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Top Face Surface -->
  <path d="M12 2.8L20.5 7.5L12 12.2L3.5 7.5L12 2.8Z" fill="url(#t-top)"/>

  <!-- Bundled Dynamite Stick Caps on Top Face -->
  <ellipse cx="8" cy="6" rx="1.2" ry="0.6" fill="#BE123C" stroke="#FB7185" stroke-width="0.3"/>
  <ellipse cx="16" cy="6" rx="1.2" ry="0.6" fill="#BE123C" stroke="#FB7185" stroke-width="0.3"/>
  <ellipse cx="8" cy="9" rx="1.2" ry="0.6" fill="#BE123C" stroke="#FB7185" stroke-width="0.3"/>
  <ellipse cx="16" cy="9" rx="1.2" ry="0.6" fill="#BE123C" stroke="#FB7185" stroke-width="0.3"/>

  <!-- Top Edge Highlight Rim -->
  <path d="M3.5 7.5L12 2.8L20.5 7.5" stroke="#FECDD3" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M12 12.2V21" stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Central Fuse Hole -->
  <ellipse cx="12" cy="7.5" rx="1.5" ry="0.8" fill="#18181B"/>

  <!-- Braided Fuse Cord -->
  <path d="M12 7.5C11.8 5.8 13.5 4.8 13 3" stroke="#D97706" stroke-width="0.85" stroke-linecap="round"/>
  <path d="M12 7.5C11.8 5.8 13.5 4.8 13 3" stroke="#FDE68A" stroke-width="0.4" stroke-dasharray="0.8 0.5" stroke-linecap="round"/>

  <!-- Burning Ember Spark Flare -->
  <circle cx="13" cy="2.8" r="1.2" fill="#F59E0B" opacity="0.4"/>
  <path d="M13 1.2L13.4 2.5L14.6 2.8L13.4 3.1L13 4.4L12.6 3.1L11.4 2.8L12.6 2.5Z" fill="#FDE68A"/>
  <circle cx="13" cy="2.8" r="0.5" fill="#FFFFFF"/>
  <!-- Flying Spark Particles -->
  <circle cx="15.2" cy="1.8" r="0.35" fill="#EF4444"/>
  <circle cx="11.2" cy="1.5" r="0.3" fill="#F59E0B"/>
</svg>
