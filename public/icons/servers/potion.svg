<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Cork Stopper -->
  <rect x="10" y="2" width="4" height="2.5" rx="0.5" fill="#B45309"/>
  <!-- Bottle Neck Rim -->
  <rect x="9" y="4.5" width="6" height="1.5" rx="0.75" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.5"/>
  <!-- Bottle Neck -->
  <rect x="10.5" y="6" width="3" height="3" fill="#E2E8F0" opacity="0.6"/>

  <!-- Flask Body -->
  <path d="M10.5 8L6.5 15C5 17.5 6.8 21 9.8 21H14.2C17.2 21 19 17.5 17.5 15L13.5 8H10.5Z" fill="#F43F5E" fill-opacity="0.85"/>
  <!-- Glass Outer Outline -->
