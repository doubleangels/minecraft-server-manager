<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="portalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Outer Frame -->
  <rect x="4" y="2.5" width="16" height="19" rx="2" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  
  <!-- Obsidian Bevel Accents -->
  <rect x="4.5" y="3" width="3" height="3" fill="#27272A"/>
  <rect x="16.5" y="3" width="3" height="3" fill="#27272A"/>
  <rect x="4.5" y="18" width="3" height="3" fill="#27272A"/>
  <rect x="16.5" y="18" width="3" height="3" fill="#27272A"/>

  <!-- Portal Swirl Aperture -->
  <rect x="7" y="5.5" width="10" height="13" rx="1" fill="url(#portalGlow)"/>

  <!-- Swirl Waves -->
  <path d="M8 8C10 6.5 13 9 16 7.5" stroke="#E9D5FF" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M8 12C11 10.5 13 13.5 16 12" stroke="#F3E8FF" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M8 16C10 14.5 13 17 16 15.5" stroke="#E9D5FF" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Star Particle -->
  <circle cx="13" cy="9.5" r="0.8" fill="#FFFFFF"/>
</svg>